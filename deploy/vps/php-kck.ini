; PHP settings for the KCK dashboard container
memory_limit = 1024M
post_max_size = 512M
upload_max_filesize = 512M
max_execution_time = 600
max_input_time = 600
expose_php = Off
; sign-out records, login lock-outs and used authenticator codes live in the temp folder (lib/auth.php):
; keep it on a Docker volume so an update / restart doesn't forget them
sys_temp_dir = /var/kck-tmp
upload_tmp_dir = /var/kck-tmp
; PHP code is only replaced by rebuilding the image, so cached code never needs re-checking
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
